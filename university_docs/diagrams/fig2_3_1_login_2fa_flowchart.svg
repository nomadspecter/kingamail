<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="760" viewBox="0 0 900 760">
  <defs>
    <style>
      text { font-family: "Liberation Sans", "DejaVu Sans", Arial, sans-serif; }
      .title { font-size: 16px; font-weight: bold; fill: #0F172A; }
      .hdr-w { font-size: 12px; font-weight: bold; fill: #FFFFFF; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2F5496"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#DC2626"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#D97706"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="760" fill="#FFFFFF"/>
  <rect x="8" y="8" width="884" height="744" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="450.0" y="34" text-anchor="middle" class="title">Figure 2.3.1: Authentication, Hashed 2FA OTP &amp; Forced Password Reset Flowchart</text>

<ellipse cx="360" cy="78" rx="72" ry="22" fill="#ECFDF5" stroke="#059669" stroke-width="1.8"/>
  <text x="360" y="80.8" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0F172A">START</text>
<path d="M 360,100 L 360,126" fill="none" stroke="#334155" stroke-width="1.8"  marker-end="url(#arrow)"/>
<rect x="235" y="126" width="250" height="44" rx="8" fill="#FFFFFF" stroke="#2F5496" stroke-width="1.8"/>
  <text x="360.0" y="144.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0F172A">Enter Email &amp; Password</text>
  <text x="360.0" y="159.5" text-anchor="middle" font-size="11.5"  fill="#0F172A">(/auth/login)</text>
<path d="M 360,170 L 360,198" fill="none" stroke="#334155" stroke-width="1.8"  marker-end="url(#arrow)"/>
<polygon points="360,198 478,240 360,282 242,240" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/>
  <text x="360" y="236.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">Account Locked</text>
  <text x="360" y="250.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">(status == 'locked')?</text>
<path d="M 478,240 L 600,240" fill="none" stroke="#DC2626" stroke-width="1.8"  marker-end="url(#arrow-red)"/>
<rect x="520.5" y="225.0" width="28.9" height="15" rx="3" fill="#F8FAFC"/><text x="535" y="236" text-anchor="middle" font-size="10" font-weight="bold" fill="#DC2626">YES</text>
<rect x="600" y="214" width="232" height="52" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.8"/>
  <text x="716.0" y="236.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0F172A">Block Login Attempt</text>
  <text x="716.0" y="251.5" text-anchor="middle" font-size="11.5"  fill="#0F172A">Write LoginLog (locked_blocked)</text>
<path d="M 360,282 L 360,316" fill="none" stroke="#334155" stroke-width="1.8"  marker-end="url(#arrow)"/>
<rect x="368.0" y="291.0" width="28.0" height="15" rx="3" fill="#F8FAFC"/><text x="382" y="302" text-anchor="middle" font-size="10" font-weight="bold" fill="#059669">NO</text>
<polygon points="360,316 482,358 360,400 238,358" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/>
  <text x="360" y="354.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">Password Hash Valid</text>
  <text x="360" y="368.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">(Werkzeug check)?</text>
<path d="M 482,358 L 600,358" fill="none" stroke="#DC2626" stroke-width="1.8"  marker-end="url(#arrow-red)"/>
<rect x="521.0" y="343.0" width="28.0" height="15" rx="3" fill="#F8FAFC"/><text x="535" y="354" text-anchor="middle" font-size="10" font-weight="bold" fill="#DC2626">NO</text>
<rect x="600" y="326" width="232" height="64" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.8"/>
  <text x="716.0" y="354.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0F172A">failed_login_count += 1</text>
  <text x="716.0" y="369.5" text-anchor="middle" font-size="11.5"  fill="#0F172A">Lock if &gt;= 5; Log 'failed'</text>
<path d="M 832,358 L 866,358 L 866,148 L 485,148" fill="none" stroke="#DC2626" stroke-width="1.8"  marker-end="url(#arrow-red)"/>
<path d="M 360,400 L 360,434" fill="none" stroke="#059669" stroke-width="1.8"  marker-end="url(#arrow-green)"/>
<rect x="369.6" y="409.0" width="28.9" height="15" rx="3" fill="#F8FAFC"/><text x="384" y="420" text-anchor="middle" font-size="10" font-weight="bold" fill="#059669">YES</text>
<rect x="205" y="434" width="310" height="48" rx="8" fill="#FFFFFF" stroke="#2F5496" stroke-width="1.8"/>
  <text x="360.0" y="454.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0F172A">Generate 6-Digit OTP -&gt; Hash (5-min Expiry)</text>
  <text x="360.0" y="469.5" text-anchor="middle" font-size="11.5"  fill="#0F172A">Render /auth/verify-otp (DEMO_MODE visible)</text>
<path d="M 360,482 L 360,514" fill="none" stroke="#334155" stroke-width="1.8"  marker-end="url(#arrow)"/>
<polygon points="360,514 482,554 360,594 238,554" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/>
  <text x="360" y="550.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">OTP Match &amp;</text>
  <text x="360" y="564.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">Not Expired?</text>
<path d="M 482,554 L 600,554" fill="none" stroke="#DC2626" stroke-width="1.8"  marker-end="url(#arrow-red)"/>
<rect x="521.0" y="539.0" width="28.0" height="15" rx="3" fill="#F8FAFC"/><text x="535" y="550" text-anchor="middle" font-size="10" font-weight="bold" fill="#DC2626">NO</text>
<rect x="600" y="530" width="232" height="48" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.8"/>
  <text x="716.0" y="550.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0F172A">Flash Error / Resend OTP</text>
  <text x="716.0" y="565.5" text-anchor="middle" font-size="11.5"  fill="#0F172A">Keep OTP Pending State</text>
<path d="M 716,530 L 716,458 L 515,458" fill="none" stroke="#334155" stroke-width="1.8"  marker-end="url(#arrow)"/>
<path d="M 360,594 L 360,624" fill="none" stroke="#059669" stroke-width="1.8"  marker-end="url(#arrow-green)"/>
<rect x="369.6" y="601.0" width="28.9" height="15" rx="3" fill="#F8FAFC"/><text x="384" y="612" text-anchor="middle" font-size="10" font-weight="bold" fill="#059669">YES</text>
<polygon points="360,624 490,666 360,708 230,666" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/>
  <text x="360" y="662.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">Compromised or</text>
  <text x="360" y="676.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">force_password_reset?</text>
<path d="M 230,666 L 175,666" fill="none" stroke="#DC2626" stroke-width="1.8"  marker-end="url(#arrow-red)"/>
<rect x="191.6" y="651.0" width="28.9" height="15" rx="3" fill="#F8FAFC"/><text x="206" y="662" text-anchor="middle" font-size="10" font-weight="bold" fill="#DC2626">YES</text>
<rect x="24" y="640" width="151" height="52" rx="8" fill="#FFF7ED" stroke="#D97706" stroke-width="1.8"/>
  <text x="99.5" y="662.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0F172A">Enforce Password</text>
  <text x="99.5" y="677.5" text-anchor="middle" font-size="11.5"  fill="#0F172A">Reset (/reset-password)</text>
<path d="M 99,692 L 99,725 L 508,725" fill="none" stroke="#334155" stroke-width="1.8"  marker-end="url(#arrow)"/>
<path d="M 490,666 L 570,666" fill="none" stroke="#059669" stroke-width="1.8"  marker-end="url(#arrow-green)"/>
<rect x="511.0" y="651.0" width="28.0" height="15" rx="3" fill="#F8FAFC"/><text x="525" y="662" text-anchor="middle" font-size="10" font-weight="bold" fill="#059669">NO</text>
<rect x="570" y="640" width="270" height="52" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.8"/>
  <text x="705.0" y="662.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0F172A">Set Session (15-min Timeout) &amp; Log 'success'</text>
  <text x="705.0" y="677.5" text-anchor="middle" font-size="11.5"  fill="#0F172A">Redirect: Admin / Manager / Inbox</text>
<path d="M 705,692 L 705,725 L 612,725" fill="none" stroke="#334155" stroke-width="1.8"  marker-end="url(#arrow)"/>
<ellipse cx="560" cy="725" rx="52" ry="19" fill="#DBEAFE" stroke="#2F5496" stroke-width="1.8"/>
  <text x="560" y="727.8" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0F172A">END</text>
</svg>