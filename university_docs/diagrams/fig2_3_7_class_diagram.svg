  <text x="287" y="148" font-size="9.5" fill="#1E293B">- status: str (active|locked|compromised)</text>
  <text x="287" y="162" font-size="9.5" fill="#1E293B">- otp_code: str, otp_expiry: datetime</text>
  <text x="287" y="176" font-size="9.5" fill="#1E293B">- force_password_reset: bool</text>
  <text x="287" y="198" font-size="9.5" font-weight="bold" fill="#2F5496">+ set_password() / check_password()</text>
  <text x="287" y="212" font-size="9.5" font-weight="bold" fill="#2F5496">+ set_otp() / check_otp() / clear_otp()</text>
  <text x="287" y="226" font-size="9.5" font-weight="bold" fill="#2F5496">+ is_compromised() / has_role()</text>
